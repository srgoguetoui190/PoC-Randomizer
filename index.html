<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Champion and Relic Selector</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Spiegel:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Video de fondo -->
    <video autoplay muted loop id="bgVideo">
        <source src="fondo.mp4" type="video/mp4">
    </video>

    <!-- Navegación superior -->
    <nav class="top-nav">
        <ul class="nav-links">
            <li><a href="https://sites.google.com/view/runeterrapoclatam/inicio" target="_blank" rel="noopener noreferrer">Wiki</a></li>
            <li><a href="#">TierMaker</a></li>
            <li><a href="#">Randomiser</a></li>
        </ul>
    </nav>

    <!-- Título principal -->
    <h1 class="title">RANDOM CHAMPION AND RELIC SELECTOR</h1>

    <!-- Botón para ocultar/mostrar filtros -->
    <button id="toggleFiltersButton" onclick="toggleFilters()">OCULTAR FILTROS</button>

    <!-- Panel de filtros -->
    <div id="filtersContainer">
        <fieldset>
            <legend>FILTRAR CAMPEONES</legend>
            <label><input type="radio" name="championFilter" value="all" checked> Todos los Campeones</label>
            <label><input type="radio" name="championFilter" value="3stars"> Solo 3 Estrellas</label>
            <label><input type="radio" name="championFilter" value="6stars"> Solo 6 Estrellas</label>
        </fieldset>

        <fieldset>
            <legend>FILTRAR RELIQUIAS</legend>
            <label><input type="checkbox" id="commonRelics" checked> Comunes</label>
            <label><input type="checkbox" id="rareRelics" checked> Raras</label>
            <label><input type="checkbox" id="epicRelics" checked> Épicas</label>
            <label><input type="checkbox" id="allowDuplicates"> Permitir Duplicadas</label>
        </fieldset>

        <fieldset>
            <legend>FILTRAR AVENTURAS</legend>
            <!-- Selección múltiple por grupos -->
            <div class="adventure-types-grid">
                <label><input type="checkbox" name="adventureType" value="normal" checked> Normales</label>
                <label><input type="checkbox" name="adventureType" value="nightmare" checked> Pesadillas</label>
                <label><input type="checkbox" name="adventureType" value="titan" checked> Titanes</label>
                <label><input type="checkbox" name="adventureType" value="spirit_blossom" checked> Flor Espiritual</label>
                <label><input type="checkbox" name="adventureType" value="highnoon" checked> Forajidos</label>
                <label><input type="checkbox" name="adventureType" value="arcane" checked> Arcane</label>
            </div>

            <!-- Botones auxiliares para selección rápida -->
            <div class="quick-select-buttons">
                <button type="button" onclick="selectAllAdventures(true)">Marcar Todas</button>
                <button type="button" onclick="selectAllAdventures(false)">Desmarcar Todas</button>
            </div>

            <hr class="filter-divider">

            <!-- Filtro por número de estrellas -->
            <div class="star-filter-container">
                <label for="adventureStarFilter">Dificultad por Estrellas:</label>
                <select id="adventureStarFilter">
                    <option value="all">Todas las estrellas</option>
                    <option value="0★">0★</option>
                    <option value="0.5★">0.5★</option>
                    <option value="1★">1★</option>
                    <option value="1.5★">1.5★</option>
                    <option value="2★">2★</option>
                    <option value="2.5★">2.5★</option>
                    <option value="3★">3★</option>
                    <option value="3.5★">3.5★</option>
                    <option value="4★">4★</option>
                    <option value="4.5★">4.5★</option>
                    <option value="5★">5★</option>
                    <option value="5.5★">5.5★</option>
                    <option value="6★">6★</option>
                    <option value="6.5★">6.5★</option>
                    <option value="10★">10★</option>
                </select>
            </div>
        </fieldset>
    </div>

    <!-- Botón Principal -->
    <button class="btn-primary-lol" onclick="selectRandom()">ELEGIR CAMPEÓN, RELIQUIAS Y AVENTURA</button>

    <!-- Disposición de las 3 Columnas principales -->
    <div class="main-layout">
        <!-- Columna Campeón -->
        <div class="card-box">
            <h2 id="championName">YASUO</h2>
            <img id="championImage" src="https://cdn.jsdelivr.net/gh/SirDiegoADM/LOR_IMAGENES@main/MINIATURA/YASUO_MINIATURA.webp" alt="Campeón">
        </div>

        <!-- Columna Reliquias -->
        <div class="card-box">
            <h2>RELIQUIAS</h2>
            <div id="relicImages" class="relics-grid">
                <!-- Se generan mediante JS -->
            </div>
        </div>

        <!-- Columna Aventura -->
        <div class="card-box">
            <h2 id="adventureName">AURELION SOL (TARGON)</h2>
            <p id="adventureStars">5★</p>
            <img id="adventureImage" src="https://ddragon.leagueoflegends.com/cdn/img/champion/splash/AurelionSol_0.jpg" alt="Aventura">
        </div>
    </div>

    <!-- Botón Cambiar Tema -->
    <button id="toggleThemeButton" onclick="toggleTheme()">CAMBIAR TEMA</button>

    <script src="script.js"></script>
</body>
</html>
